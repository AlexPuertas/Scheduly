<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado — Scheduly</title>
    <link rel="stylesheet" th:href="@{/css/index-style.css}">
    <style>
        body { display: flex; align-items: center; justify-content: center; padding: 40px 20px; }

        .error-card {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 60px 48px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-md);
        }

        .icon-wrap {
            width: 72px; height: 72px;
            background: var(--danger-bg);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 2rem;
            border: 1px solid #F3B9B3;
        }

        .error-card h1 {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 12px;
            color: var(--danger);
        }

        .error-card p {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .info-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            text-align: left;
            margin-bottom: 28px;
        }

        .info-box ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }

        .info-box li {
            font-size: 0.85rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .info-box li strong { color: var(--text); }

        .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 12px 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.18s;
        }

        .btn-primary:hover { background: var(--navy-light); color: white; text-decoration: none; }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: none;
            color: var(--danger);
            border: 1.5px solid #F3B9B3;
            border-radius: var(--radius);
            padding: 12px 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
        }

        .btn-outline:hover { background: var(--danger-bg); border-color: var(--danger); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="icon-wrap">&#128683;</div>
        <h1>Acceso denegado</h1>
        <p>No tienes permisos para acceder a esta página. Verifica tu rol de usuario o contacta al administrador.</p>

        <div class="info-box">
            <ul>
                <li>&#127970; Solo las <strong>Empresas</strong> pueden crear horarios</li>
                <li>&#128100; Solo los <strong>Clientes</strong> pueden reservar horarios</li>
            </ul>
        </div>

        <div class="btn-row">
            <a href="/horarios" class="btn-primary">
                &#128197; Ir a horarios
            </a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-outline">
                    &#8594; Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</body>
</html>
