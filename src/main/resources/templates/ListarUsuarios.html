<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — Scheduly</title>
    <link rel="stylesheet" th:href="@{/css/index-style.css}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="/horarios" class="logo">Scheduly</a>
            <div class="nav-links">
                <a href="/horarios" class="nav-link">&#128197; Horarios</a>
                <a href="/usuarios" class="nav-link active">&#128101; Usuarios</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="user-chip">
                <div class="user-avatar">A</div>
                <span>Admin</span>
                <span class="chevron">&#9660;</span>
                <div class="user-dropdown">
                    <div class="dropdown-header">
                        <div class="dh-label">Sesión activa</div>
                        <strong>Administrador</strong>
                    </div>
                    <form th:action="@{/logout}" method="post" style="margin:0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-logout">&#8594; Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="page">
        <div class="page-header">
            <div class="page-header-left">
                <div class="eyebrow">Administración</div>
                <h1>Usuarios registrados</h1>
            </div>
            <a href="/usuarios/crear" class="btn-create">
                &#43; Nuevo usuario
            </a>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Usuario</th>
                        <th>Contacto</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="id-cell" th:text="${usuario.id}"></td>
                        <td>
                            <div class="user-info">
                                <span class="user-name" th:text="${usuario.nombre != null ? usuario.nombre : '—'}"></span>
                                <span class="user-email" th:text="${usuario.email}"></span>
                            </div>
                        </td>
                        <td>
                            <div class="user-info">
                                <span th:text="${usuario.telefono != null ? usuario.telefono : '—'}" style="font-size:0.87rem"></span>
                                <span th:text="${usuario.direccion != null ? usuario.direccion : ''}" style="font-size:0.78rem;color:var(--muted)"></span>
                            </div>
                        </td>
                        <td>
                            <span th:if="${usuario.rol.name() == 'EMPRESA'}" class="badge badge-empresa">
                                Empresa
                            </span>
                            <span th:if="${usuario.rol.name() == 'CLIENTE'}" class="badge badge-cliente">
                                Cliente
                            </span>
                        </td>
                        <td>
                            <!-- BUG FIX: el admin puede crear horarios para cualquier empresa -->
                            <a th:if="${usuario.rol.name() == 'EMPRESA'}"
                               th:href="@{/horarios/crear-admin/{email}(email=${usuario.email})}"
                               class="btn-action">
                                &#128197; Crear horario
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
